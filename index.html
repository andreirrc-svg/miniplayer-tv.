<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool-TV Miniplayer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Panou Lateral Stânga */
        #sidebar { 
            width: 320px; 
            background: #121212; 
            border-right: 2px solid #222; 
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
        }

        #sidebar h2 { 
            padding: 20px; 
            font-size: 1.2rem; 
            border-bottom: 2px solid #222; 
            color: #00adb5; 
            text-align: center; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .list { 
            overflow-y: auto; 
            flex: 1; 
            padding: 12px; 
        }

        /* Butoane optimizate pentru Telecomandă Mi Box */
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px 20px; 
            margin-bottom: 10px; 
            background: #1a1a1a; 
            color: #ccc; 
            border: 2px solid transparent; 
            border-radius: 8px; 
            text-align: left; 
            font-size: 1.1rem; 
            font-weight: 600;
            cursor: pointer; 
            outline: none; 
            transition: all 0.2s ease;
        }

        /* Starea de Focus (Stil Telecomandă) */
        .btn:focus { 
            background: #00adb5; 
            color: #fff; 
            border-color: #ffffff; 
            transform: scale(1.03); 
            box-shadow: 0 0 15px rgba(0, 173, 181, 0.6); 
        }

        .btn.active { 
            background: #00797f; 
            color: #fff; 
        }

        /* Zone Player Dreapta */
        #player-container { 
            flex: 1; 
            background: #000; 
            position: relative; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: #000;
        }

        #overlay-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #333;
            font-size: 0.9rem;
            color: #aaa;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Canale Cool-TV</h2>
        <div class="list" id="channel-list">
            <!-- Canale principale Cool-TV -->
            <button class="btn" data-slug="protv" onclick="changeChannel('protv', this)">Pro TV</button>
            <button class="btn" data-slug="antena1" onclick="changeChannel('antena1', this)">Antena 1</button>
            <button class="btn" data-slug="kanald" onclick="changeChannel('kanald', this)">Kanal D</button>
            <button class="btn" data-slug="digisport1" onclick="changeChannel('digisport1', this)">Digi Sport 1</button>
            <button class="btn" data-slug="digisport2" onclick="changeChannel('digisport2', this)">Digi Sport 2</button>
            <button class="btn" data-slug="digi24" onclick="changeChannel('digi24', this)">Digi 24</button>
            <button class="btn" onclick="changeChannel('hbomax', this)">HBO</button>
            <button class="btn" onclick="changeChannel('cinemax', this)">Cinemax</button>
            <button class="btn" onclick="changeChannel('prima', this)">Prima TV</button>
            <button class="btn" onclick="changeChannel('realitatea', this)">Realitatea Plus</button>
        </div>
    </div>

    <div id="player-container">
        <div id="overlay-info">Apasă OK pe telecomandă pentru schimbare</div>
        <iframe id="tv-frame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        // Selectare automată la pornire pentru telecomandă
        window.addEventListener('DOMContentLoaded', () => {
            const firstBtn = document.querySelector('.btn');
            if (firstBtn) {
                firstBtn.focus();
                firstBtn.click();
            }
        });

        function changeChannel(slug, element) {
            // Actualizează starea vizuală a butoanelor
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if (element) element.classList.add('active');

            const frame = document.getElementById('tv-frame');
            
            // Reîncarcă iframe-ul direct din sursa Cool-TV
            frame.src = `https://cool-tv.net/ch/${slug}.html`;
        }

        // Administrare navigare din săgeți pe telecomandă
        document.addEventListener('keydown', (e) => {
            const buttons = Array.from(document.querySelectorAll('.btn'));
            const currentIndex = buttons.indexOf(document.activeElement);

            if (e.key === 'ArrowDown') {
                if (currentIndex < buttons.length - 1) {
                    buttons[currentIndex + 1].focus();
                }
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                if (currentIndex > 0) {
                    buttons[currentIndex - 1].focus();
                }
                e.preventDefault();
            }
        });
    </script>
</body>
</html>

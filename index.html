<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniplayer TV Web</title>
    <!-- Librarie HLS pentru redare m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0f0f0f; color: #fff; font-family: system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 240px; background: #181818; border-right: 1px solid #282828; display: flex; flex-direction: column; }
        #sidebar h2 { padding: 15px; margin: 0; font-size: 1.1rem; border-bottom: 1px solid #282828; color: #00adb5; }
        .list { overflow-y: auto; flex: 1; }
        .btn { display: block; width: 100%; padding: 12px 15px; background: none; color: #ccc; border: none; text-align: left; cursor: pointer; border-bottom: 1px solid #222; }
        .btn:hover { background: #222; color: #00adb5; }
        .btn.active { background: #00adb5; color: #fff; font-weight: bold; }
        #player-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; }
        #loader { position: absolute; color: #00adb5; font-size: 1.1rem; display: none; background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 8px; z-index: 10; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Canale TV</h2>
        <div class="list">
            <button class="btn" onclick="playChannel('protv', this)">Pro TV</button>
            <button class="btn" onclick="playChannel('antena1', this)">Antena 1</button>
            <button class="btn" onclick="playChannel('kanald', this)">Kanal D</button>
            <button class="btn" onclick="playChannel('digi24', this)">Digi 24</button>
            <button class="btn" onclick="playChannel('digisport1', this)">Digi Sport 1</button>
            <button class="btn" onclick="playChannel('prima', this)">Prima TV</button>
            <button class="btn" onclick="playChannel('hbomax', this)">HBO</button>
        </div>
    </div>

    <div id="player-container">
        <div id="loader">Se obține stream-ul activ...</div>
        <video id="video" controls autoplay></video>
    </div>

    <script>
        let hlsPlayer = null;

        async function playChannel(slug, btnElement) {
            // Evidențiere buton activ
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            const targetUrl = `https://cool-tv.net/ch/${slug}.html`;
            // Folosim un proxy public de CORS pentru a putea citi Cool-TV din GitHub
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // Căutăm link-ul .m3u8 generat în HTML-ul paginii
                const match = data.contents.match(/(https?:\/\/[^\s"']+\.m3u8[^\s"']*)/i);

                if (match && match[0]) {
                    loader.style.display = 'none';
                    startHls(match[0]);
                } else {
                    loader.innerText = 'Stream inexistent sau protejat.';
                }
            } catch (err) {
                loader.innerText = 'Eroare de conexiune la proxy.';
            }
        }

        function startHls(url) {
            const video = document.getElementById('video');
            if (hlsPlayer) hlsPlayer.destroy();

            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }
    </script>
</body>
</html>

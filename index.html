<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniplayer Android TV</title>
    <!-- Folosim o versiune stabilă de HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.3.1/dist/hls.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 300px; background: #121212; border-right: 2px solid #222; display: flex; flex-direction: column; z-index: 10; }
        #sidebar h2 { padding: 20px; margin: 0; font-size: 1.3rem; border-bottom: 2px solid #222; color: #00adb5; text-align: center; }
        .list { overflow-y: auto; flex: 1; padding: 10px; }
        
        .btn { 
            display: block; width: 100%; padding: 15px 20px; margin-bottom: 8px; 
            background: #1a1a1a; color: #aaa; border: 2px solid transparent; 
            border-radius: 8px; text-align: left; font-size: 1.1rem; 
            cursor: pointer; outline: none; transition: all 0.1s;
        }

        .btn:focus, .btn:hover { 
            background: #00adb5; color: #fff; border-color: #fff; 
            transform: scale(1.02);
        }

        .btn.active { background: #00888e; color: #fff; }
        
        #player-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        #loader { 
            position: absolute; color: #fff; font-size: 1.2rem; display: none; 
            background: rgba(0,0,0,0.85); padding: 20px 30px; border-radius: 10px; border: 1px solid #00adb5; z-index: 20; 
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Canale M3U8 (Securizate)</h2>
        <div class="list">
            <!-- Stream-uri sigure (HTTPS + CORS permis) care vor funcționa pe TV Bro / GitHub -->
            <button class="btn" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', this)">Test Player (Filmul Big Buck Bunny)</button>
            <button class="btn" onclick="playStream('https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8', this)">Red Bull TV HD</button>
            <button class="btn" onclick="playStream('https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8', this)">NASA TV Public</button>
            <button class="btn" onclick="playStream('https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8', this)">DW News HD</button>
            <button class="btn" onclick="playStream('https://cctvnocnc.v.wscdns.com/live/cctv16_2/index.m3u8', this)">CCTV Olympics</button>
            <!-- Stream-uri RO libere cunoscute (funcționarea depinde de disponibilitatea serverelor sursă) -->
            <button class="btn" onclick="playStream('https://stream1.realitatea.net/live/smil:realitatea.smil/playlist.m3u8', this)">Realitatea Plus</button>
            <button class="btn" onclick="playStream('https://strm.mywebtv.info/live/tvr1/playlist.m3u8', this)">TVR 1</button>
        </div>
    </div>

    <div id="player-container">
        <div id="loader">Se conectează...</div>
        <video id="video" controls autoplay></video>
    </div>

    <script>
        let hlsPlayer = null;

        window.onload = () => {
            const firstBtn = document.querySelector('.btn');
            if (firstBtn) firstBtn.focus();
        };

        function playStream(url, btnElement) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const loader = document.getElementById('loader');
            const video = document.getElementById('video');
            
            loader.innerText = 'Se conectează la stream...';
            loader.style.display = 'block';

            if (hlsPlayer) {
                hlsPlayer.destroy();
            }

            if (Hls.isSupported()) {
                hlsPlayer = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    loader.style.display = 'none';
                    video.play().catch(e => console.log('Autoplay blocat:', e));
                });

                hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                loader.innerText = 'Eroare de rețea sau CORS blocat de serverul canalului.';
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                loader.innerText = 'Eroare la redarea video-ului.';
                                hlsPlayer.recoverMediaError();
                                break;
                            default:
                                loader.innerText = 'Canal indisponibil.';
                                hlsPlayer.destroy();
                                break;
                        }
                        loader.style.display = 'block';
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Suport nativ pentru Safari / Android TV (dacă browserul o permite)
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    loader.style.display = 'none';
                    video.play();
                });
                video.addEventListener('error', () => {
                    loader.innerText = 'Eroare la încărcarea fluxului.';
                    loader.style.display = 'block';
                });
            }
        }
    </script>
</body>
</html>

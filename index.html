<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Player</title>
  <!-- Includem HLS.js pentru a permite redarea stream-urilor .m3u8 în elementul <video> -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root { color-scheme: dark; --accent: #14b8a6; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #050505; color: #fff; font: 20px system-ui, sans-serif; display: grid; grid-template-columns: minmax(260px, 24vw) 1fr; }
    aside { background: #111827; border-right: 2px solid #263142; display: flex; flex-direction: column; min-width: 0; }
    h1 { margin: 0; padding: 22px 20px; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); border-bottom: 1px solid #263142; }
    #channels { overflow-y: auto; padding: 14px; }
    .channel { display: block; width: 100%; margin: 0 0 10px; padding: 18px; border: 3px solid transparent; border-radius: 10px; background: #1f2937; color: #d1d5db; font: inherit; text-align: left; cursor: pointer; outline: none; }
    .channel.active { background: #115e59; color: #fff; }
    .channel:focus { border-color: #fff; background: var(--accent); color: #06201d; transform: scale(1.025); box-shadow: 0 0 20px #14b8a688; }
    main { position: relative; display: grid; place-items: center; min-width: 0; background: #000; }
    video, iframe { width: 100%; height: 100%; object-fit: contain; background: #000; border: none; }
    #empty { max-width: 38rem; padding: 28px; text-align: center; line-height: 1.5; color: #cbd5e1; }
    #empty strong { display: block; color: #fff; font-size: 1.2em; margin-bottom: 8px; }
    #info { position: absolute; top: 20px; right: 20px; padding: 10px 14px; border-radius: 8px; background: #000b; color: #d1d5db; pointer-events: none; transition: opacity .4s; z-index: 10; }
    #info.hidden { opacity: 0; }
    @media (max-width: 800px) { body { grid-template-columns: 38vw 1fr; } .channel { padding: 14px; font-size: 16px; } }
  </style>
</head>
<body>
  <aside>
    <h1>Canale TV</h1>
    <div id="channels" role="listbox" aria-label="Lista canalelor"></div>
  </aside>
  <main>
    <!-- Elementul video folosit pentru stream-urile directe .m3u8 -->
    <video id="player" controls autoplay playsinline></video>
    
    <!-- Elementul iframe folosit ca alternativă directă pentru site-ul Cool-TV -->
    <iframe id="iframe-player" allow="autoplay; fullscreen; encrypted-media" style="display: none;"></iframe>
    
    <div id="empty"><strong>Se selectează canalul...</strong>Apasă OK pentru a încărca transmisiunea.</div>
    <div id="info">↑ ↓ selectează · OK/Enter redă · Back oprește</div>
  </main>
  <script>
    // Grila popualtă cu canalele principale de pe cool-tv.net
    const CHANNELS = [
      { name: 'Pro TV', slug: 'protv' },
      { name: 'Antena 1', slug: 'antena1' },
      { name: 'Kanal D', slug: 'kanald' },
      { name: 'Digi Sport 1', slug: 'digisport1' },
      { name: 'Digi Sport 2', slug: 'digisport2' },
      { name: 'Digi 24', slug: 'digi24' },
      { name: 'Prima TV', slug: 'prima' },
      { name: 'HBO', slug: 'hbomax' },
      { name: 'Cinemax', slug: 'cinemax' },
      { name: 'Realitatea Plus', slug: 'realitatea' },
      { name: 'B1 TV', slug: 'b1tv' },
      { name: 'România TV', slug: 'romaniatv' }
    ];

    const list = document.querySelector('#channels');
    const player = document.querySelector('#player');
    const iframePlayer = document.querySelector('#iframe-player');
    const empty = document.querySelector('#empty');
    const info = document.querySelector('#info');
    let selected = 0, infoTimer, hlsInstance = null;

    CHANNELS.forEach((channel, index) => {
      const button = document.createElement('button');
      button.className = 'channel'; button.type = 'button'; button.textContent = channel.name;
      button.setAttribute('role', 'option'); button.dataset.index = index;
      button.addEventListener('click', () => play(index));
      button.addEventListener('focus', () => select(index));
      list.append(button);
    });
    const buttons = [...document.querySelectorAll('.channel')];

    function select(index) {
      selected = Math.max(0, Math.min(index, CHANNELS.length - 1));
      buttons.forEach((button, i) => button.classList.toggle('active', i === selected));
      buttons[selected]?.scrollIntoView({ block: 'nearest' });
      showInfo();
    }

    function stopPlayback() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      player.pause();
      player.removeAttribute('src');
      player.load();
      player.style.display = 'none';
      
      iframePlayer.src = 'about:blank';
      iframePlayer.style.display = 'none';
      
      empty.hidden = false;
    }

    function play(index) {
      select(index);
      const channel = CHANNELS[index];
      stopPlayback();
      empty.hidden = true;

      // Încărcăm player-ul nativ Cool-TV direct în iframe pentru a ocoli restricțiile CORS
      iframePlayer.style.display = 'block';
      iframePlayer.src = `https://cool-tv.net/ch/${channel.slug}.html`;
      
      showInfo(channel.name);
    }

    function showInfo(text) {
      if (text) info.textContent = text;
      info.classList.remove('hidden'); clearTimeout(infoTimer);
      infoTimer = setTimeout(() => info.classList.add('hidden'), 2800);
    }

    document.addEventListener('keydown', event => {
      const key = event.key;
      if (['ArrowDown', 'ArrowUp', 'Enter', ' ', 'Backspace', 'Escape'].includes(key)) event.preventDefault();
      if (key === 'ArrowDown') { select(Math.min(selected + 1, CHANNELS.length - 1)); buttons[selected].focus(); }
      if (key === 'ArrowUp') { select(Math.max(selected - 1, 0)); buttons[selected].focus(); }
      if (key === 'Enter' || key === ' ') play(selected);
      if (key === 'Backspace' || key === 'Escape') { stopPlayback(); showInfo('Redare oprită'); }
    });

    select(0); buttons[0]?.focus();
  </script>
</body>
</html>

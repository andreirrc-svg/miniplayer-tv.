<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniplayer Android TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Meniu optimizat pentru telecomandă */
        #sidebar { width: 280px; background: #121212; border-right: 2px solid #222; display: flex; flex-direction: column; z-index: 10; }
        #sidebar h2 { padding: 20px; margin: 0; font-size: 1.3rem; border-bottom: 2px solid #222; color: #00adb5; text-align: center; }
        .list { overflow-y: auto; flex: 1; padding: 10px; }
        
        /* Stil buton focalizabil de telecomandă */
        .btn { 
            display: block; 
            width: 100%; 
            padding: 15px 20px; 
            margin-bottom: 8px; 
            background: #1a1a1a; 
            color: #aaa; 
            border: 2px solid transparent; 
            border-radius: 8px;
            text-align: left; 
            font-size: 1.1rem;
            cursor: pointer; 
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        /* Starea când telecomanda se află pe buton */
        .btn:focus, .btn:hover { 
            background: #00adb5; 
            color: #fff; 
            border-color: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 173, 181, 0.5);
        }

        .btn.active { background: #00888e; color: #fff; }

        /* Zona video */
        #player-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; }
        
        #loader { 
            position: absolute; 
            color: #fff; 
            font-size: 1.2rem; 
            display: none; 
            background: rgba(0,0,0,0.85); 
            padding: 20px 30px; 
            border-radius: 10px; 
            border: 1px solid #00adb5;
            z-index: 20; 
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Canale TV</h2>
        <div class="list" id="channelList">
            <!-- Adaugă sau reordonează canalele aici -->
            <button class="btn" tabindex="1" onclick="playChannel('protv', this)">Pro TV</button>
            <button class="btn" tabindex="2" onclick="playChannel('antena1', this)">Antena 1</button>
            <button class="btn" tabindex="3" onclick="playChannel('kanald', this)">Kanal D</button>
            <button class="btn" tabindex="4" onclick="playChannel('digi24', this)">Digi 24</button>
            <button class="btn" tabindex="5" onclick="playChannel('digisport1', this)">Digi Sport 1</button>
            <button class="btn" tabindex="6" onclick="playChannel('prima', this)">Prima TV</button>
            <button class="btn" tabindex="7" onclick="playChannel('hbomax', this)">HBO</button>
        </div>
    </div>

    <div id="player-container">
        <div id="loader">Se obține stream-ul...</div>
        <video id="video" controls autoplay></video>
    </div>

    <script>
        let hlsPlayer = null;

        // Auto-focus pe primul canal când se deschide aplicația pe TV
        window.onload = () => {
            const firstBtn = document.querySelector('.btn');
            if (firstBtn) firstBtn.focus();
        };

        async function playChannel(slug, btnElement) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const loader = document.getElementById('loader');
            loader.innerText = 'Se obține stream-ul activ...';
            loader.style.display = 'block';

            const targetUrl = `https://cool-tv.net/ch/${slug}.html`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const match = data.contents.match(/(https?:\/\/[^\s"']+\.m3u8[^\s"']*)/i);

                if (match && match[0]) {
                    loader.style.display = 'none';
                    startHls(match[0]);
                } else {
                    loader.innerText = 'Stream inexistent sau protejat.';
                }
            } catch (err) {
                loader.innerText = 'Eroare de conexiune la proxy.';
            }
        }

        function startHls(url) {
            const video = document.getElementById('video');
            if (hlsPlayer) hlsPlayer.destroy();

            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        // Suport pentru tasta "Back" / "Inapoi" de pe telecomanda Xiaomi
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Back' || e.keyCode === 10009 || e.keyCode === 27) {
                const activeBtn = document.querySelector('.btn.active') || document.querySelector('.btn');
                if (activeBtn) activeBtn.focus();
            }
        });
    </script>
</body>
</html>

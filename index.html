<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniplayer TV Romania</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 280px; background: #121212; border-right: 2px solid #222; display: flex; flex-direction: column; z-index: 10; }
        #sidebar h2 { padding: 20px; margin: 0; font-size: 1.3rem; border-bottom: 2px solid #222; color: #00adb5; text-align: center; }
        .list { overflow-y: auto; flex: 1; padding: 10px; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 15px 20px; 
            margin-bottom: 8px; 
            background: #1a1a1a; 
            color: #aaa; 
            border: 2px solid transparent; 
            border-radius: 8px;
            text-align: left; 
            font-size: 1.1rem;
            cursor: pointer; 
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        .btn:focus, .btn:hover { 
            background: #00adb5; 
            color: #fff; 
            border-color: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 173, 181, 0.5);
        }

        .btn.active { background: #00888e; color: #fff; }

        #player-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; }
        
        #loader { 
            position: absolute; 
            color: #fff; 
            font-size: 1.2rem; 
            display: none; 
            background: rgba(0,0,0,0.85); 
            padding: 20px 30px; 
            border-radius: 10px; 
            border: 1px solid #00adb5;
            z-index: 20; 
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Canale TV Directe</h2>
        <div class="list" id="channelList">
            <button class="btn" onclick="playStream('https://dtolive.protv.ro/live/smil:protv.smil/playlist.m3u8', this)">Pro TV</button>
            <button class="btn" onclick="playStream('https://m3u.pro/streams/ro/digi24.m3u8', this)">Digi 24</button>
            <button class="btn" onclick="playStream('https://strm.mywebtv.info/live/tvr1/playlist.m3u8', this)">TVR 1</button>
            <button class="btn" onclick="playStream('https://strm.mywebtv.info/live/tvr2/playlist.m3u8', this)">TVR 2</button>
            <button class="btn" onclick="playStream('https://m3u.pro/streams/ro/realitatea.m3u8', this)">Realitatea Plus</button>
            <button class="btn" onclick="playStream('https://m3u.pro/streams/ro/b1tv.m3u8', this)">B1 TV</button>
            <button class="btn" onclick="playStream('https://m3u.pro/streams/ro/romaniatv.m3u8', this)">Romania TV</button>
            <button class="btn" onclick="playStream('https://m3u.pro/streams/ro/euronews.m3u8', this)">Euronews RO</button>
        </div>
    </div>

    <div id="player-container">
        <div id="loader">Se încarcă canalul...</div>
        <video id="video" controls autoplay></video>
    </div>

    <script>
        let hlsPlayer = null;

        window.onload = () => {
            const firstBtn = document.querySelector('.btn');
            if (firstBtn) firstBtn.focus();
        };

        function playStream(url, btnElement) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const loader = document.getElementById('loader');
            loader.innerText = 'Se conectează la stream...';
            loader.style.display = 'block';

            const video = document.getElementById('video');
            if (hlsPlayer) hlsPlayer.destroy();

            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    loader.style.display = 'none';
                    video.play();
                });

                hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        loader.innerText = 'Canal indisponibil temporar.';
                        loader.style.display = 'block';
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    loader.style.display = 'none';
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
